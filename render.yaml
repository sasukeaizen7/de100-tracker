# Render blueprint for the DE100 Tracker API (NestJS). The web app is deployed on Vercel and
# forwards /api/* here (see web/vercel.json), so the browser only ever talks to the Vercel domain.
services:
  - type: web
    name: de100-tracker-api
    runtime: node
    plan: free
    region: ohio            # same AWS region as the Neon database (us-east-2): ~1 ms per query instead of ~110 ms
    rootDir: backend
    # NODE_ENV=production would make `npm ci` skip devDependencies, but the build needs the Nest CLI.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "2"            # browser -> Vercel rewrite -> Render proxy -> app
      - key: DATABASE_URL     # Neon connection string, ending in ?sslmode=verify-full
        sync: false
      - key: WEB_ORIGIN       # e.g. https://de100-tracker.vercel.app
        sync: false
      - key: API_PUBLIC_URL   # e.g. https://de100-tracker.vercel.app/api
        sync: false
      - key: EXTENSION_IDS    # optional: Chrome extension ID(s), comma-separated
        sync: false
